      handleGlobalAction(actionId, dataset = {}, targetEl = null) {
        switch (actionId) {
          case 'switch-view':
            state.session.currentView = dataset.view || 'learn';
            this.render();
            break;
          case 'get-started':
            state.onboardingComplete = false;
            state.session.onboardingStep = 1;
            if (!state.nativeLanguage) state.nativeLanguage = 'english';
            if (!state.learningLanguage) state.learningLanguage = 'spanish';
            if (!state.currentCourse) state.currentCourse = state.learningLanguage;
            this.render();
            break;
          case 'resume-progress':
            if (state.onboardingComplete || state.xp > 0 || Object.keys(state.courseProgress || {}).some(id => (state.courseProgress[id]?.completedLessons || []).length)) {
              state.onboardingComplete = true;
              state.session.currentView = 'learn';
              AppState.save();
              this.render();
            } else {
              state.session.onboardingStep = 1;
              this.render();
            }
            break;
          case 'continue-onboarding':
            this.advanceOnboarding();
            break;
          case 'go-back-step':
          case 'skip-onboarding':
            this.previousOnboarding();
            break;
          case 'select-native':
            state.nativeLanguage = dataset.language;
            AppState.save();
            this.render();
            break;
          case 'select-target-language':
            state.learningLanguage = dataset.language;
            if (CourseManager.getCourse(dataset.language)) state.currentCourse = dataset.language;
            AppState.save();
            this.render();
            break;
          case 'select-goal-purpose':
            state.motivation = dataset.goal || '';
            AppState.save();
            this.render();
            break;
          case 'select-practice-goal':
            state.selectedGoal = dataset.goal || 'regular';
            state.settings.dailyGoal = GOAL_OPTIONS[state.selectedGoal].xp;
            state.dailyGoal = state.settings.dailyGoal;
            AppState.save();
            this.render();
            break;
          case 'explore-catalog':
            this.openLanguagePicker();
            break;
          case 'preview-language':
            state.learningLanguage = dataset.language || state.learningLanguage;
            if (CourseManager.getCourse(state.learningLanguage)) state.currentCourse = state.learningLanguage;
            this.showToast(`${LanguageManager.getLanguageById(state.learningLanguage)?.name || 'Language'} selected.`);
            break;
          case 'open-language-picker':
            this.openLanguagePicker();
            break;
          case 'pick-language':
            if (!CourseManager.getCourse(dataset.language)) {
              this.showToast('That course is coming soon.');
              break;
            }
            AppState.applyCourseSwitch(dataset.language);
            AppState.save();
            this.closeModal();
            this.render();
            break;
          case 'start-lesson-card':
            this.startCurrentLesson();
            break;
          case 'open-lesson-path':
            this.startSpecificLesson(Number(dataset.unit), Number(dataset.lesson));
            break;
          case 'open-settings':
            this.openModal('settings');
            break;
          case 'close-modal':
            this.closeModal();
            break;
          case 'toggle-sound':
          case 'toggle-speech':
          case 'toggle-animations':
          case 'change-theme':
          case 'change-goal':
          case 'import-progress-file':
            break;
          case 'reset-progress-confirm':
            this.confirmReset();
            break;
          case 'confirm-reset':
            Object.assign(state, defaultState());
            state.onboardingComplete = false;
            state.settings = { ...DEFAULT_SETTINGS };
            window.localStorage.removeItem(STORAGE_KEY);
            this.closeModal();
            this.render();
            break;
          case 'export-progress':
            StorageManager.exportProgress();
            break;
          case 'import-progress-file':
            const fileInput = document.querySelector('[data-action="import-progress-file"]');
            if (fileInput && fileInput.files && fileInput.files[0]) {
              StorageManager.importProgress(fileInput.files[0]);
            }
            break;
          case 'dev-reset':
            Object.assign(state, defaultState());
            localStorage.removeItem(STORAGE_KEY);
            state.onboardingComplete = true;
            state.learningLanguage = 'spanish';
            location.reload();
            break;
          case 'dev-xp':
            state.xp += 100;
            AppState.save();
            this.render();
            break;
          case 'dev-hearts':
            state.hearts = state.maxHearts;
            AppState.save();
            this.render();
            break;
          case 'dev-streak':
            state.streak = 0;
            AppState.save();
            this.render();
            break;
          case 'dev-next':
            const progress = CourseManager.getCourseProgress(state.learningLanguage);
            progress.currentLesson = Math.min(progress.currentLesson + 1, 5);
            AppState.save();
            this.render();
            break;
          case 'dev-clear':
            localStorage.removeItem(STORAGE_KEY);
            break;
          case 'open-heart-info':
            this.showToast('Hearts are lost for wrong answers and restored through practice.');
            break;
          case 'open-streak-info':
            this.showToast('A streak grows when you study on consecutive days.');
            break;
          case 'open-xp-info':
            this.showToast('XP powers your level, quests, and world progress.');
            break;
          case 'open-coin-info':
            this.showToast('Coins are earned through lessons, quests, and achievements.');
            break;
          case 'claim-quest':
            QuestManager.claimQuest(dataset.questId);
            this.render();
            break;
          case 'start-practice-review':
            this.startPracticeReview();
            break;
          case 'start-weak-review':
            this.startWeakReview();
            break;
          case 'start-listening-practice':
            this.startListeningPractice();
            break;
          case 'practice-hearts':
            this.startHeartPractice();
            break;
          case 'focus-current-lesson':
            this.startCurrentLesson();
            break;
          case 'review-mistakes':
            this.reviewLastMistakes();
            break;
          case 'close-lesson':
            this.closeLesson();
            break;
          case 'submit-current-question':
            this.submitCurrentQuestion();
            break;
          case 'continue-lesson':
            this.advanceLessonQuestion();
            break;
          case 'select-option':
            this.selectLessonOption(dataset.value);
            break;
          case 'play-audio-question':
            this.playAudioPrompt();
            break;
          case 'play-audio-slow':
            this.playAudioPrompt(true);
            break;
          case 'pick-word-bank':
            this.toggleWordBankSelection(dataset.word, targetEl);
            break;
          case 'matching-select-left':
            this.handleMatchingSelection('left', dataset.value, targetEl);
            break;
          case 'matching-select-right':
            this.handleMatchingSelection('right', dataset.value, targetEl);
            break;
          case 'skip-current-question':
            this.skipQuestion();
            break;
          case 'start-speaking':
            this.startSpeakingRecognition();
            break;
          case 'catalog-region':
            this.filterCatalogRegion(dataset.region);
            break;
          default:
            break;
        }
      },
      bindAppEventsOnce() {
        if (this.appEventsBound) return;
        this.appEventsBound = true;
        document.addEventListener('click', (event) => this.handleAppClick(event));
        document.addEventListener('change', (event) => this.handleAppChange(event));
        document.addEventListener('keydown', (event) => this.handleAppKeydown(event));
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => AppState.applyTheme());
      },
      handleAppClick(event) {
        const modalBackdrop = event.target.closest('[data-role="modal-backdrop"]');
        if (modalBackdrop && event.target === modalBackdrop) {
          this.closeModal();
          return;
        }
        const target = event.target.closest('[data-action]');
        if (!target) return;
        if (target.matches('input, select, textarea')) return;
        const actionId = target.getAttribute('data-action');
        this.handleGlobalAction(actionId, target.dataset, target);
      },
      handleAppChange(event) {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const actionId = target.getAttribute('data-action');
        if (actionId === 'toggle-sound') {
          state.settings.soundEnabled = !!target.checked;
          state.soundEnabled = state.settings.soundEnabled;
          AppState.save();
        } else if (actionId === 'toggle-speech') {
          state.settings.speechEnabled = !!target.checked;
          AppState.save();
        } else if (actionId === 'toggle-animations') {
          state.settings.animations = !!target.checked;
          AppState.save();
        } else if (actionId === 'change-theme') {
          state.settings.theme = target.value;
          state.theme = state.settings.theme;
          AppState.applyTheme();
          AppState.save();
        } else if (actionId === 'change-goal') {
          state.dailyGoal = Number(target.value) || 20;
          state.settings.dailyGoal = state.dailyGoal;
          AppState.save();
          this.render();
        } else if (actionId === 'import-progress-file' && target.files && target.files[0]) {
          StorageManager.importProgress(target.files[0]);
        }
      },
      handleAppKeydown(event) {
        if (event.key === 'Escape') {
          const modalRoot = document.getElementById('modalRoot');
          if (modalRoot && modalRoot.innerHTML.trim()) {
            this.closeModal();
            return;
          }
        }
        if (event.key === 'Enter' && document.getElementById('lessonOverlay')) {
          const lesson = this.activeLesson;
          if (!lesson || lesson.completed) return;
          if (lesson.phase === 'feedback') this.advanceLessonQuestion();
          else this.submitCurrentQuestion();
        }
      },
      renderOnboarding() {
        this.render();
      },
      advanceOnboarding() {
        const step = Number(state.session.onboardingStep || 1);
        if (step < 5) {
          state.session.onboardingStep = step + 1;
          AppState.save();
          this.render();
          return;
        }
        state.nativeLanguage = state.nativeLanguage || 'english';
        state.learningLanguage = state.learningLanguage || 'spanish';
        if (!CourseManager.getCourse(state.learningLanguage)) {
          state.learningLanguage = 'spanish';
        }
        state.selectedGoal = state.selectedGoal || 'regular';
        state.dailyGoal = GOAL_OPTIONS[state.selectedGoal]?.xp || state.dailyGoal || 20;
        state.settings.dailyGoal = state.dailyGoal;
        AppState.startOnboarding();
        this.render();
      },
      previousOnboarding() {
        const step = Number(state.session.onboardingStep || 1);
        if (step > 1) {
          state.session.onboardingStep = step - 1;
        } else {
          state.session.onboardingStep = 0;
        }
        this.render();
      },
      openLanguagePicker() {
        let modalRoot = document.getElementById('modalRoot');
        if (!modalRoot) {
          modalRoot = document.createElement('div');
          modalRoot.id = 'modalRoot';
          this.root.appendChild(modalRoot);
        }
        modalRoot.innerHTML = this.renderLanguagePicker();
      },
      confirmReset() {
        this.openModal('reset-progress');
      },
      filterCatalogRegion(region) {
        const modalRoot = document.getElementById('modalRoot');
        if (!modalRoot) return;
        const catalog = LanguageManager.getFilteredCatalog({ query: '', region: region || 'all', status: 'all' });
        const grid = modalRoot.querySelector('.language-grid');
        const chips = modalRoot.querySelectorAll('[data-action="catalog-region"]');
        chips.forEach(chip => chip.classList.toggle('active', chip.dataset.region === region));
        if (!grid) return;
        grid.innerHTML = catalog.map(lang => `
          <article class="language-card ${lang.status === 'available' ? 'available' : 'coming'}">
            <header>
              <div class="flag">${lang.flag}</div>
              <span class="status-pill ${lang.status === 'available' ? 'available' : 'coming'}">${lang.status === 'available' ? 'Available' : 'Coming Soon'}</span>
            </header>
            <div>
              <h4>${lang.name}</h4>
              <small>${lang.nativeName}</small>
            </div>
            <div class="meta">
              <span>${lang.region}</span>
              <button class="primary-btn" data-action="pick-language" data-language="${lang.id}" style="padding:8px 12px; font-size:0.72rem;">${lang.status === 'available' ? 'Start' : 'View'}</button>
            </div>
          </article>
        `).join('');
      },
      startCurrentLesson() {
        const course = AppState.getCurrentLanguageInfo();
        const progress = CourseManager.getCourseProgress(course.id);
        const unitIndex = Math.max(0, (progress.currentUnit || 1) - 1);
        const lessonIndex = Math.max(0, (progress.currentLesson || 1) - 1);
        this.startSpecificLesson(unitIndex, lessonIndex);
      },
      startSpecificLesson(unitIndex, lessonIndex) {
        const course = AppState.getCurrentLanguageInfo();
        if (!course || !COURSE_DATA[course.id]) {
          this.showToast('That course is coming soon.');
          return;
        }
        const status = CourseManager.getLessonStatus(course.id, unitIndex, lessonIndex);
        if (status === 'locked') {
          this.showToast('Complete the previous lesson to unlock this one.');
          return;
        }
        if (state.hearts <= 0) {
          this.openModal('heart-depleted');
          return;
        }
        const session = LessonEngine.prepareSession(course.id, Number(unitIndex), Number(lessonIndex));
        if (!session) {
          this.showToast('That lesson is not available yet.');
          return;
        }
        this.activeLesson = session;
        this.renderLessonOverlay();
      },
      closeLesson() {
        const overlay = document.getElementById('lessonOverlay');
        if (overlay) overlay.remove();
        this.activeLesson = null;
        this.render();
      },
      selectLessonOption(value) {
        const lesson = this.activeLesson;
        if (!lesson || lesson.answerLocked || lesson.phase === 'feedback') return;
        lesson.selectedValue = value;
        document.querySelectorAll('#lessonOverlay .answer-option').forEach(el => {
          el.classList.toggle('selected', el.dataset.value === value);
        });
      },
      renderLessonOverlay() {
        const session = this.activeLesson;
        if (!session) return;
        const existing = document.getElementById('lessonOverlay');
        if (existing) existing.remove();
        const currentQuestion = session.questions[session.qIndex];
        const progressPct = ((session.qIndex + 1) / session.questions.length) * 100;
        const isFeedback = session.phase === 'feedback';
        const isLast = session.qIndex >= session.questions.length - 1;
        const primaryAction = isFeedback ? 'continue-lesson' : 'submit-current-question';
        const primaryLabel = isFeedback ? (isLast ? 'FINISH' : 'CONTINUE') : 'CHECK';
        this.root.insertAdjacentHTML('beforeend', `
          <div class="lesson-overlay" id="lessonOverlay" aria-modal="true" role="dialog">
            <div class="lesson-sheet">
              <div class="lesson-top">
                <div>
                  <div class="mini-kicker">${session.unitTitle}</div>
                  <h3 style="margin:0; letter-spacing:-0.04em;">${session.lessonTitle}</h3>
                </div>
                <button class="lesson-close" data-action="close-lesson" aria-label="Close lesson">✕</button>
              </div>
              <div class="lesson-progress-row">
                <div class="progress-bar" style="flex:1;">
                  <div class="progress-fill" style="--progress:${progressPct}%;"></div>
                </div>
                <div class="lesson-stats">
                  <span class="tiny-pill">❤️ ${state.hearts}</span>
                  <span class="tiny-pill">⚡ ${session.xpEarned || 0}</span>
                </div>
              </div>
              <div class="question-box" id="lessonQuestionBox">
                ${this.renderQuestion(currentQuestion, session)}
              </div>
              <div class="lesson-controls">
                <div class="left">
                  <button class="quiz-action" data-action="skip-current-question" ${isFeedback ? 'disabled' : ''}>SKIP</button>
                  ${currentQuestion && currentQuestion.type === 'listening' ? '<button class="quiz-action" data-action="play-audio-question">🔊 PLAY</button>' : ''}
                  ${currentQuestion && currentQuestion.type === 'listening' ? '<button class="quiz-action" data-action="play-audio-slow">🐢 SLOW</button>' : ''}
                </div>
                <div class="right">
                  <button class="quiz-action primary" data-action="${primaryAction}">${primaryLabel}</button>
                </div>
              </div>
            </div>
          </div>
        `);
      },
      renderQuestion(question, session) {
        if (!question) return '<h4>Lesson complete.</h4>';
        const prompt = question.questionText || question.prompt || 'Respond';
        let html = `
          <div class="question-meta">
            <span>Question ${session.qIndex + 1}/${session.questions.length}</span>
            <span>${question.type.replace('-', ' ')}</span>
          </div>
          <h4>${prompt}</h4>
        `;

        if (question.type === 'multiple-choice') {
          html += `
            <div class="answer-options">
              ${question.choices.map((choice, index) => `
                <button class="answer-option" data-action="select-option" data-index="${index}" data-value="${choice}">${choice}</button>
              `).join('')}
            </div>
          `;
        }

        if (question.type === 'translate-input') {
          html += `
            <div class="input-row">
              <input class="text-input" data-role="answer-input" type="text" aria-label="Answer input" placeholder="Type your answer" />
            </div>
          `;
        }

        if (question.type === 'word-bank') {
          html += `
            <div class="word-sequence" data-role="word-sequence"></div>
            <div class="word-bank">
              ${question.bank.map((word, index) => `
                <button class="word-chip" data-action="pick-word-bank" data-word="${word}">${word}</button>
              `).join('')}
            </div>
          `;
        }

        if (question.type === 'matching') {
          html += `
            <div class="match-grid">
              <div class="match-column">
                ${question.left.map((item, index) => `
                  <button class="match-item" data-action="matching-select-left" data-index="${index}" data-value="${item}">${item}</button>
                `).join('')}
              </div>
              <div class="match-column">
                ${question.right.map((item, index) => `
                  <button class="match-item" data-action="matching-select-right" data-index="${index}" data-value="${item}">${item}</button>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (question.type === 'fill-blank') {
          html += `
            <div class="input-row">
              <input class="text-input" data-role="answer-input" type="text" aria-label="Fill blank answer" placeholder="Type the missing word" />
            </div>
          `;
        }

        if (question.type === 'listening') {
          html += `
            <div class="input-row">
              <button class="quiz-action" data-action="play-audio-question">🔊 Play prompt</button>
              <button class="quiz-action" data-action="play-audio-slow">🐢 Slow</button>
            </div>
            <div class="answer-options">
              ${question.choices.map((choice, index) => `
                <button class="answer-option" data-action="select-option" data-index="${index}" data-value="${choice}">${choice}</button>
              `).join('')}
            </div>
          `;
        }

        if (question.type === 'conversation-choice') {
          html += `
            <div class="answer-options">
              ${question.choices.map((choice, index) => `
                <button class="answer-option" data-action="select-option" data-index="${index}" data-value="${choice}">${choice}</button>
              `).join('')}
            </div>
          `;
        }

        if (question.type === 'match-image') {
          html += `
            <div class="answer-options">
              ${question.choices.map((choice, index) => `
                <button class="answer-option" data-action="select-option" data-index="${index}" data-value="${choice.value}">
                  <span style="font-size:1.7rem; margin-right:10px;">${choice.emoji}</span>${choice.label}
                </button>
              `).join('')}
            </div>
          `;
        }

        if (question.type === 'speaking') {
          const supported = AudioManager.speechRecognitionSupported();
          html += `
            <div class="input-row">
              ${supported
                ? `<button class="quiz-action" data-action="start-speaking">🎙️ Speak</button>`
                : `<div class="empty-state" style="padding:12px;">Speech recognition is not supported in this browser. Type your answer instead.</div>
                   <input class="text-input" data-role="answer-input" type="text" aria-label="Spoken answer fallback" placeholder="Type what you would say" />`}
            </div>
          `;
        }

        return html;
      },
      toggleWordBankSelection(word, el) {
        const lesson = this.activeLesson;
        if (!lesson || lesson.answerLocked || lesson.phase === 'feedback') return;
        if (!lesson.wordBankSelection) lesson.wordBankSelection = [];
        const index = lesson.wordBankSelection.indexOf(word);
        if (index >= 0) {
          lesson.wordBankSelection.splice(index, 1);
          el.classList.remove('selected');
        } else {
          lesson.wordBankSelection.push(word);
          el.classList.add('selected');
        }
        const sequence = document.querySelector('[data-role="word-sequence"]');
        if (sequence) {
          const selected = lesson.wordBankSelection || [];
          sequence.innerHTML = selected.map(item => `<span class="word-chip selected">${item}</span>`).join('') || '<span style="color:var(--muted);">Your phrase will appear here...</span>';
        }
      },
      handleMatchingSelection(side, value, el) {
        const lesson = this.activeLesson;
        if (!lesson || lesson.answerLocked || lesson.phase === 'feedback') return;
        lesson.matchingSelection = lesson.matchingSelection || {};
        lesson.matchingPairs = lesson.matchingPairs || [];
        lesson.matchingSelection[side] = { value, el };
        document.querySelectorAll('#lessonOverlay .match-item').forEach(item => item.classList.remove('selected'));
        if (el) el.classList.add('selected');
        if (lesson.matchingSelection.left && lesson.matchingSelection.right) {
          lesson.matchingPairs.push({
            left: lesson.matchingSelection.left.value,
            right: lesson.matchingSelection.right.value
          });
          if (lesson.matchingSelection.left.el) lesson.matchingSelection.left.el.classList.add('selected');
          if (lesson.matchingSelection.right.el) lesson.matchingSelection.right.el.classList.add('selected');
          lesson.matchingSelection = {};
        }
      },
      playAudioPrompt(slow = false) {
        const question = this.activeLesson?.questions[this.activeLesson.qIndex];
        if (!question || !question.audioText) return;
        const lang = AppState.getCurrentLanguageInfo().languageCode || 'es-ES';
        AudioManager.speak(question.audioText, lang, slow ? 0.7 : 1.1);
      },
      skipQuestion() {
        const lesson = this.activeLesson;
        if (!lesson || lesson.completed || lesson.phase === 'feedback') return;
        lesson.wrongCount += 1;
        lesson.answers.push({ question: lesson.questions[lesson.qIndex], correct: false, answer: '', skipped: true });
        this.advanceLessonQuestion();
      },
      evaluateAnswer(q, lesson) {
        let userAnswer = '';
        let selectedValue = lesson.selectedValue || '';
        const input = document.querySelector('#lessonOverlay [data-role="answer-input"]');
        if (input) userAnswer = input.value.trim();
        if (q.type === 'word-bank') {
          userAnswer = (lesson.wordBankSelection || []).join(' ');
        }
        if (q.type === 'matching') {
          const expected = q.answer || [];
          const pairs = lesson.matchingPairs || [];
          const isCorrect = expected.length > 0 && expected.every(pair => pairs.some(item => item.left === pair.left && item.right === pair.right));
          return { isCorrect, normalizedAnswer: pairs.map(p => `${p.left}|${p.right}`).join(',') };
        }
        if (!selectedValue && !userAnswer && q.type !== 'word-bank') {
          return { missing: true };
        }
        const normalizedAnswer = this.normalizeAnswer(selectedValue || userAnswer || '');
        const correctText = this.normalizeAnswer(Array.isArray(q.answer) ? q.answer.join(' ') : (q.answer || ''));
        const validAlternatives = (q.alternatives || []).map(item => this.normalizeAnswer(item));
        const isCorrect = normalizedAnswer === correctText || validAlternatives.includes(normalizedAnswer);
        return { isCorrect, normalizedAnswer };
      },
      submitCurrentQuestion() {
        const lesson = this.activeLesson;
        if (!lesson || lesson.completed) return;
        if (lesson.phase === 'feedback') {
          this.advanceLessonQuestion();
          return;
        }
        if (lesson.answerLocked) return;
        const q = lesson.questions[lesson.qIndex];
        if (!q) {
          this.finishLesson();
          return;
        }
        const result = this.evaluateAnswer(q, lesson);
        if (result.missing) {
          this.showToast('Select or type an answer before continuing.');
          return;
        }
        lesson.answerLocked = true;
        lesson.phase = 'feedback';
        const isCorrect = !!result.isCorrect;
        if (isCorrect) {
          lesson.correctCount += 1;
          lesson.score += 1;
          lesson.xpEarned += 2;
          state.totalCorrectAnswers += 1;
          XPManager.addXP(2);
          AppState.updateGoalProgress(2, 0, 1);
          AudioManager.beep('correct');
          this.showFeedback(true, q.explanation || 'Correct!');
          const questionBox = document.getElementById('lessonQuestionBox');
          if (questionBox) {
            questionBox.classList.add('correct-answer-bounce');
            setTimeout(() => questionBox.classList.remove('correct-answer-bounce'), 500);
          }
        } else {
          lesson.wrongCount += 1;
          state.totalWrongAnswers += 1;
          HeartManager.loseHeart();
          AudioManager.beep('incorrect');
          this.showFeedback(false, q.explanation || 'Not quite!');
          const questionBox = document.getElementById('lessonQuestionBox');
          if (questionBox) {
            questionBox.classList.add('incorrect-answer-shake');
            setTimeout(() => questionBox.classList.remove('incorrect-answer-shake'), 500);
          }
        }
        if (q.answer) {
          VocabularyManager.registerSeen(String(Array.isArray(q.answer) ? q.answer[0] : q.answer), lesson.courseId, q.prompt || '', isCorrect);
        }
        lesson.answers.push({ question: q, correct: isCorrect, answer: result.normalizedAnswer });
        const primary = document.querySelector('#lessonOverlay [data-action="submit-current-question"], #lessonOverlay [data-action="continue-lesson"]');
        if (primary) {
          const isLast = lesson.qIndex >= lesson.questions.length - 1;
          primary.dataset.action = 'continue-lesson';
          primary.textContent = isLast ? 'FINISH' : 'CONTINUE';
        }
        const skip = document.querySelector('#lessonOverlay [data-action="skip-current-question"]');
        if (skip) skip.disabled = true;
        const heartPill = document.querySelector('#lessonOverlay .lesson-stats .tiny-pill');
        if (heartPill) heartPill.textContent = `❤️ ${state.hearts}`;
        AppState.save();
      },
      advanceLessonQuestion() {
        const lesson = this.activeLesson;
        if (!lesson || lesson.completed) return;
        lesson.qIndex += 1;
        lesson.phase = 'answering';
        lesson.answerLocked = false;
        lesson.selectedValue = '';
        lesson.wordBankSelection = [];
        lesson.matchingSelection = {};
        lesson.matchingPairs = [];
        if (lesson.qIndex >= lesson.questions.length) {
          this.finishLesson();
          return;
        }
        this.renderLessonOverlay();
      },
      showFeedback(isCorrect, explanation) {
        const questionBox = document.getElementById('lessonQuestionBox');
        if (!questionBox) return;
        const banner = document.createElement('div');
        banner.className = isCorrect ? 'correct-banner' : 'wrong-banner';
        banner.innerHTML = `${isCorrect ? 'Correct!' : 'Not quite!'}<div style="font-weight:700; margin-top:6px; color:var(--text);">${explanation}</div>`;
        questionBox.appendChild(banner);
      },
      normalizeAnswer(value) {
        return String(value || '').toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?;:]/g, '');
      },
      finishLesson() {
        const lesson = this.activeLesson;
        if (!lesson) return;
        if (lesson.completed || lesson.rewardsGranted) {
          this.openLessonResult(lesson.lastScore || 0, lesson.lastBonusXp || 0, lesson.correctCount, lesson.questions.length, state.streak);
          return;
        }
        lesson.completed = true;
        lesson.rewardsGranted = true;
        const overlay = document.getElementById('lessonOverlay');
        if (overlay) overlay.remove();
        const courseId = lesson.courseId || state.learningLanguage || state.currentCourse;
        const unitIndex = Number(lesson.unitIndex);
        const lessonIndex = Number(lesson.lessonIndex);
        const score = lesson.questions.length ? (lesson.correctCount / lesson.questions.length) * 100 : 0;
        const bonusXp = 10;
        const coinsGained = 5 + Math.round(score / 20);
        XPManager.addXP(bonusXp);
        AppState.updateGoalProgress(bonusXp, 1, 0);
        state.coins += coinsGained;
        state.session.dailyGoalProgress = Math.min((state.dailyHistory[this.getTodayKey()]?.xp || 0), Number(state.dailyGoal || 20));
        StreakManager.updateFromStudy();
        state.lessonScores[`${courseId}:${unitIndex}:${lessonIndex}`] = { accuracy: score, date: this.getTodayKey(), xp: lesson.xpEarned + bonusXp };
        AppState.markLessonCompleted(courseId, unitIndex, lessonIndex, { accuracy: score, xp: lesson.xpEarned + bonusXp });
        QuestManager.syncDailyProgress();
        AchievementManager.checkAll();
        lesson.lastScore = score;
        lesson.lastBonusXp = bonusXp + lesson.xpEarned;
        state.session.lastLesson = {
          courseId,
          unitIndex,
          lessonIndex,
          answers: lesson.answers,
          score
        };
        const finishedLesson = lesson;
        this.activeLesson = null;
        AppState.save();
        this.render();
        UIManager.showToast(`Lesson complete! +${bonusXp + finishedLesson.xpEarned} XP`);
        if (score >= 90) {
          AudioManager.beep('correct');
          this.showConfetti();
        }
        this.openLessonResult(score, bonusXp + finishedLesson.xpEarned, finishedLesson.correctCount, finishedLesson.questions.length, state.streak);
      },
      openLessonResult(score, xpGained, correct, total, streak) {
        const modal = document.createElement('div');
        modal.className = 'modals';
        modal.innerHTML = `
          <div class="modal-window">
            <div class="modal-header">
              <h3>LESSON COMPLETE!</h3>
            </div>
            <div class="modal-body">
              <div style="font-size:1.8rem; text-align:center; margin-bottom:10px;">⭐ ⭐ ⭐</div>
              <div class="subtle-list">
                <div class="subtle-item"><span>Accuracy</span><strong>${Math.round(score)}%</strong></div>
                <div class="subtle-item"><span>XP Earned</span><strong>+${xpGained}</strong></div>
                <div class="subtle-item"><span>Words Practiced</span><strong>${total}</strong></div>
                <div class="subtle-item"><span>Streak</span><strong>🔥 ${streak} days</strong></div>
              </div>
              <div class="modal-actions">
                <button class="primary-btn" data-action="close-modal">CONTINUE</button>
                <button class="secondary-btn" data-action="review-mistakes">REVIEW MISTAKES</button>
              </div>
            </div>
          </div>
        `;
        const root = document.getElementById('modalRoot');
        root.innerHTML = '';
        root.appendChild(modal);
      },
      showConfetti() {
        const colors = ['#ffb647', '#5b7cff', '#32b57d', '#ff5a7a', '#1bb7a8'];
        for (let i = 0; i < 22; i++) {
          const piece = document.createElement('div');
          piece.style.position = 'fixed';
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.top = `${Math.random() * 24}%`;
          piece.style.width = '10px';
          piece.style.height = '16px';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.borderRadius = '4px';
          piece.style.transform = `rotate(${Math.random() * 360}deg)`;
          piece.style.zIndex = '200';
          piece.style.pointerEvents = 'none';
          piece.style.animation = 'floatXP 1.8s ease forwards';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1800);
        }
      },
      getCurrentCourseFlag() {
        const course = AppState.getCurrentLanguageInfo();
        return course.flag || '🌍';
      },
      getCurrentCourseName() {
        return AppState.getCurrentLanguageInfo().name || 'Spanish';
      },
      startPracticeReview() {
        this.showToast('Quick review started.');
      },
      startWeakReview() {
        this.showToast('Weak word review is ready.');
      },
      startListeningPractice() {
        const course = AppState.getCurrentLanguageInfo();
        const sample = course.name === 'Japanese' ? 'こんにちは' : course.name === 'French' ? 'Bonjour' : course.name === 'German' ? 'Hallo' : 'Hola';
        AudioManager.speak(sample, course.languageCode || 'es-ES', 1);
      },
      startSpeakingRecognition() {
        const lesson = this.activeLesson;
        if (!lesson || lesson.answerLocked || lesson.phase === 'feedback') return;
        if (!AudioManager.speechRecognitionSupported()) {
          this.showToast('Speech recognition is not supported in this browser.');
          return;
        }
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new Recognition();
        const course = CourseManager.getCourse(lesson.courseId) || AppState.getCurrentLanguageInfo();
        recognition.lang = course.languageCode || 'es-ES';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = (event) => {
          const text = event.results?.[0]?.[0]?.transcript || '';
          if (!text) {
            this.showToast('No speech was captured. Try again.');
            return;
          }
          lesson.selectedValue = text;
          const input = document.querySelector('#lessonOverlay [data-role="answer-input"]');
          if (input) input.value = text;
          this.showToast(`Heard: ${text}`);
        };
        recognition.onerror = () => {
          this.showToast('Speech recognition failed. You can type your answer instead.');
        };
        recognition.start();
      },
      startHeartPractice() {
        if (state.hearts < state.maxHearts) {
          HeartManager.rewardHeart();
          AppState.save();
          this.closeModal();
          this.render();
          this.showToast('❤️ Heart restored!');
        } else {
          this.showToast('Hearts are already full.');
        }
      },
      reviewLastMistakes() {
        const last = state.session.lastLesson;
        const mistakes = (last?.answers || []).filter(item => item && item.correct === false);
        this.closeModal();
        if (!mistakes.length) {
          this.showToast('No mistakes to review from the last lesson.');
          return;
        }
        this.showToast(`You missed ${mistakes.length} question${mistakes.length === 1 ? '' : 's'} last lesson.`);
      }
    };

    /* =====================================================
       EVENT BINDING
    ===================================================== */

    document.addEventListener('DOMContentLoaded', () => {
      AppState.init();
      if (DEV_MODE) AppState.initDevTools();
      UIManager.bindAppEventsOnce();
      if (state.onboardingComplete) {
        state.session.currentView = state.session.currentView || 'learn';
      }
      UIManager.render();
    });

    window.addEventListener('beforeunload', () => {
      AppState.save();
    });

    function updateAppStateFromOnboarding() {
      state.nativeLanguage = state.nativeLanguage || 'english';
      state.learningLanguage = state.learningLanguage || 'spanish';
      state.currentCourse = state.learningLanguage;
      state.session.currentView = 'learn';
      AppState.reconcileProgress();
      AppState.save();
    }

    Object.assign(window, {
      AppState,
      StorageManager,
      LanguageManager,
      CourseManager,
      LessonEngine,
      AudioManager,
      XPManager,
      StreakManager,
      HeartManager,
      QuestManager,
      AchievementManager,
      VocabularyManager,
      UIManager
    });
  </script>
</body>
</html>
