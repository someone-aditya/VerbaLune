<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingoQuest</title>
  <meta name="description" content="LingoQuest — Learn a language. Unlock the world." />
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef4ff;
      --surface-3: #f8f4ff;
      --text: #1f2a37;
      --muted: #64748b;
      --primary: #5b7cff;
      --primary-2: #7a6af8;
      --secondary: #1bb7a8;
      --success: #32b57d;
      --danger: #f15a5a;
      --warning: #ffb647;
      --info: #5ca8ff;
      --shadow: 0 18px 45px rgba(31, 42, 55, 0.12);
      --border: rgba(148, 163, 184, 0.28);
      --glow: rgba(91, 124, 255, 0.2);
      --xp: #ffb800;
      --coin: #ffcc5c;
      --heart: #ff5a7a;
      --streak: #ff8c42;
      --navy: #1a2a4d;
      --card-radius: 24px;
      --button-radius: 16px;
      --transition: 180ms ease;
    }

    body[data-theme="dark"] {
      --bg: #0d1728;
      --surface: #111d30;
      --surface-2: #14253f;
      --surface-3: #18263d;
      --text: #edf3ff;
      --muted: #9bb0d2;
      --primary: #7f9dff;
      --primary-2: #a383ff;
      --secondary: #27d6c4;
      --success: #49cc91;
      --danger: #ff7a7a;
      --warning: #ffc96e;
      --border: rgba(180, 196, 230, 0.16);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      --glow: rgba(127, 157, 255, 0.22);
      --navy: #dfeaff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hidden { display: none !important; }

    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px 18px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      color: white;
      font-size: 1.2rem;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .nav-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 12px 14px;
      border-radius: 16px;
      text-align: left;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all var(--transition);
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      background: var(--surface-2);
      border-color: var(--border);
      outline: none;
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(91,124,255,.12), rgba(27,183,168,.12));
      color: var(--text);
      border-color: rgba(91,124,255,.22);
      box-shadow: inset 0 0 0 1px rgba(91,124,255,.08);
    }

    .nav-icon { width: 18px; text-align: center; }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .main-shell {
      flex: 1;
      padding: 22px 18px 18px;
      min-width: 0;
      position: relative;
    }

    .main-inner {
      max-width: 1180px;
      margin: 0 auto;
      min-height: calc(100vh - 40px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
      padding: 4px 2px 10px;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.04);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar .primary-btn,
    .primary-btn,
    .secondary-btn,
    .ghost-btn,
    .icon-btn,
    .chip-btn,
    .quiz-action {
      border: none;
      border-radius: var(--button-radius);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
    }

    .primary-btn,
    .secondary-btn,
    .ghost-btn,
    .icon-btn,
    .chip-btn,
    .quiz-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 12px 26px rgba(91, 124, 255, 0.32);
      padding: 12px 18px;
    }

    .secondary-btn {
      background: linear-gradient(135deg, rgba(27,183,168,.12), rgba(91,124,255,.12));
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 12px;
      min-width: 44px;
      min-height: 44px;
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .ghost-btn:hover,
    .icon-btn:hover,
    .chip-btn:hover,
    .quiz-action:hover,
    .language-card:hover,
    .nav-item:hover,
    .action-card:hover,
    .progress-node:hover,
    .quest-card:hover,
    .achievement-card:hover,
    .destination-card:hover,
    .stat-tile:hover,
    .mini-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(31, 42, 55, 0.08);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .ghost-btn:active,
    .icon-btn:active,
    .chip-btn:active,
    .quiz-action:active {
      transform: translateY(1px) scale(0.99);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .language-card:focus-visible,
    .progress-node:focus-visible,
    .destination-card:focus-visible {
      outline: 3px solid rgba(91,124,255,.3);
      outline-offset: 2px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) 300px;
      gap: 18px;
      align-items: start;
    }

    .content-panel {
      min-width: 0;
    }

    .stats-panel {
      position: sticky;
      top: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
    }

    .banner-card {
      padding: 22px;
      background: linear-gradient(135deg, rgba(91,124,255,.08), rgba(27,183,168,.08));
      border: 1px solid rgba(91,124,255,.18);
    }

    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .hero-copy h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin: 0;
      max-width: 680px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255,255,255,.3);
      border: 1px solid rgba(255,255,255,.2);
      font-size: 1.6rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    }

    .journey-card {
      padding: 18px 18px 22px;
      position: relative;
      overflow: hidden;
    }

    .journey-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(91,124,255,.06), rgba(27,183,168,.05));
      pointer-events: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 14px;
    }

    .section-header h2,
    .section-header h3 {
      margin: 0;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .course-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .mini-kicker {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(91,124,255,.1);
      border-radius: 999px;
      padding: 7px 10px;
      border: 1px solid rgba(91,124,255,.14);
      margin-bottom: 10px;
    }

    .course-badge {
      background: linear-gradient(135deg, rgba(91,124,255,.12), rgba(27,183,168,.12));
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      padding: 7px 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
    }

    .language-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
      min-height: 150px;
      transition: all var(--transition);
    }

    .language-card.available { border-color: rgba(50,181,125,.3); }
    .language-card.coming { opacity: 0.72; }

    .language-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .language-card .flag {
      font-size: 1.8rem;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(91,124,255,.08);
      box-shadow: inset 0 0 0 1px rgba(91,124,255,.08);
    }

    .language-card h4 {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }

    .language-card small {
      color: var(--muted);
    }

    .language-card .meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
    }

    .language-card .action { margin-top: 4px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 8px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill.available {
      background: rgba(50,181,125,.12);
      color: var(--success);
    }

    .status-pill.coming {
      background: rgba(255,182,71,.12);
      color: var(--warning);
    }

    .search-box {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text);
      margin-bottom: 16px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chip-btn {
      padding: 10px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 700;
    }

    .chip-btn.active {
      background: rgba(91,124,255,.12);
      border-color: rgba(91,124,255,.18);
      color: var(--text);
    }

    .stats-grid {
      display: grid;
      gap: 12px;
    }

    .stat-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 82px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.03);
      transition: all var(--transition);
    }

    .stat-tile .value {
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .stat-tile .label {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      background: rgba(91,124,255,.08);
    }

    .streak .icon-circle { background: rgba(255,140,66,.12); }
    .heart .icon-circle { background: rgba(255,90,122,.12); }
    .xp .icon-circle { background: rgba(255,184,0,.12); }
    .coin .icon-circle { background: rgba(255,204,92,.12); }

    .goal-card,
    .quest-card,
    .achievement-card,
    .destination-card,
    .mini-card,
    .practice-card,
    .vocab-card,
    .profile-card,
    .panel-section,
    .modal-body,
    .lesson-sheet,
    .lesson-info,
    .landing-screen,
    .onboarding-screen,
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .quest-card,
    .achievement-card,
    .destination-card,
    .mini-card,
    .practice-card,
    .vocab-card,
    .profile-card,
    .panel-section {
      padding: 16px;
    }

    .quest-list,
    .achievement-list,
    .destinations-list,
    .profile-list,
    .vocab-list,
    .practice-list {
      display: grid;
      gap: 12px;
    }

    .quest-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .quest-card .meta { display: flex; flex-direction: column; gap: 4px; }
    .quest-card .title { font-weight: 800; }
    .quest-card small { color: var(--muted); }
    .reward-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,204,92,.12);
      color: var(--warning);
      font-weight: 800;
    }

    .progress-bar {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: rgba(148,163,184,.18);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 250ms ease;
    }

    .xp-bar {
      height: 12px;
      background: rgba(148,163,184,.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .xp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--value, 0%);
      background: linear-gradient(90deg, #ffc457, #ff9d43);
      border-radius: inherit;
      transition: width 300ms ease;
    }

    .journey-tree {
      position: relative;
      padding: 18px 18px 30px 18px;
    }

    .journey-tree::before {
      content: "";
      position: absolute;
      left: 32px;
      top: 24px;
      bottom: 18px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(91,124,255,.35), rgba(27,183,168,.18));
    }

    .lesson-node-list {
      position: relative;
      display: grid;
      gap: 18px;
      margin-left: 8px;
    }

    .lesson-node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-left: 28px;
      min-height: 56px;
    }

    .lesson-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface);
      border: 3px solid var(--border);
      box-shadow: 0 0 0 4px rgba(91,124,255,.06);
      z-index: 1;
    }

    .lesson-node.current::before {
      border-color: var(--primary);
      background: rgba(91,124,255,.12);
      box-shadow: 0 0 0 4px rgba(91,124,255,.14), 0 0 20px rgba(91,124,255,.2);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .lesson-node.completed::before {
      border-color: var(--success);
      background: rgba(50,181,125,.12);
    }

    .lesson-node.locked::before {
      border-color: rgba(148,163,184,.45);
      background: rgba(148,163,184,.1);
    }

    .node-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      color: var(--text);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.04);
    }

    .lesson-node.completed .node-body {
      border-color: rgba(50,181,125,.2);
      background: linear-gradient(135deg, rgba(50,181,125,.06), rgba(91,124,255,.04));
    }

    .lesson-node.current .node-body {
      border-color: rgba(91,124,255,.25);
      background: linear-gradient(135deg, rgba(91,124,255,.08), rgba(27,183,168,.08));
    }

    .node-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .node-main strong { font-size: 0.98rem; }
    .node-main small { color: var(--muted); }

    .node-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 32px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.78rem;
      background: rgba(148,163,184,.08);
      color: var(--muted);
    }

    .lesson-node.completed .node-state {
      background: rgba(50,181,125,.12);
      color: var(--success);
    }

    .lesson-node.current .node-state {
      background: rgba(91,124,255,.12);
      color: var(--primary);
    }

    .lesson-node.locked .node-state {
      background: rgba(148,163,184,.08);
      color: var(--muted);
    }

    .floating-xp {
      position: fixed;
      right: 26px;
      top: 110px;
      background: rgba(255,184,0,.1);
      color: var(--warning);
      border: 1px solid rgba(255,184,0,.2);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(255,184,0,.18);
      transform: translateY(0);
      opacity: 0;
      pointer-events: none;
      animation: floatXP 1.1s ease forwards;
      z-index: 90;
    }

    @keyframes floatXP {
      0% { opacity: 0; transform: translateY(24px) scale(0.9); }
      18% { opacity: 1; } 
      100% { opacity: 0; transform: translateY(-30px) scale(1.06); }
    }

    .toast-stack {
      position: fixed;
      right: 20px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .toast {
      min-width: 220px;
      max-width: 260px;
      background: rgba(17,29,48,.95);
      color: white;
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 18px 26px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08);
      animation: slideIn 250ms ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .modals {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17,29,48,.36);
      z-index: 140;
      padding: 18px;
    }

    .modal-window {
      width: min(560px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 22px 60px rgba(17,29,48,.22);
      overflow: hidden;
      animation: modalIn 220ms ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }

    .modal-header {

      gap: 10px;

    .lesson-overlay {

    .lesson-close {

      height: 44px;

    }

    .lesson-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .lesson-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tiny-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;

    }

    .question-box {
      background: linear-gradient(135deg, rgba(91,124,255,.04), rgba(27,183,168,.04));

      border-radius: 20px;

      margin-bottom: 18px;

    .question-box h4 {

    .question-meta {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: 700;

    .answer-options {

    .answer-option {

    }

    .answer-option.correct {

      background: rgba(50,181,125,.08);
    }

    .answer-option.wrong {

      background: rgba(241,90,90,.08);
    }

    .text-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .word-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      font-weight: 700;
    }

    .word-chip.selected {
      background: rgba(91,124,255,.12);
      border-color: rgba(91,124,255,.2);
    }

    .word-sequence {

      background: rgba(148,163,184,.04);
      margin: 10px 0 12px;

    .match-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .match-column {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      background: rgba(148,163,184,.02);
    }

    .match-item {
      display: block;
      width: 100%;
      padding: 12px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: left;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text);
    }

    .match-item.selected {
      border-color: rgba(91,124,255,.42);
      background: rgba(91,124,255,.08);
    }

    .match-item.matched {
      opacity: 0.7;
      background: rgba(50,181,125,.08);
      border-color: rgba(50,181,125,.3);
    }

    .correct-banner,
    .wrong-banner {
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 800;
      margin-top: 10px;
      border: 1px solid transparent;
    }

    .correct-banner {
      background: rgba(50,181,125,.08);
      border-color: rgba(50,181,125,.18);
      color: var(--success);
    }

    .wrong-banner {
      background: rgba(241,90,90,.08);
      border-color: rgba(241,90,90,.18);
      color: var(--danger);
    }

    .lesson-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .lesson-controls .left,

      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quiz-action {
      padding: 12px 16px;
      min-width: 120px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);

    .quiz-action.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));

      border: none;
      box-shadow: 0 12px 24px rgba(91,124,255,.2);

    .screen-wrap {

    .landing-screen {
      max-width: 1140px;
      margin: 0 auto;
      padding: 28px 24px 32px;
      background: linear-gradient(135deg, rgba(91,124,255,.05), rgba(27,183,168,.05));
    }

    .landing-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 34px;
      padding: 18px 0;
    }

    .hero-visual {
      flex: 1;
      min-width: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nova-card {
      background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(127,157,255,.08));
      border-radius: 32px;
      border: 1px solid rgba(91,124,255,.18);
      width: min(390px, 100%);
      min-height: 320px;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 52px rgba(91,124,255,.12);
      position: relative;
      overflow: hidden;
    }

    .nova-card::before,
    .nova-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(91,124,255,.08);
    }

    .nova-card::before { width: 220px; height: 220px; left: -45px; top: -35px; }
    .nova-card::after { width: 200px; height: 200px; right: -40px; bottom: -50px; }

    .nova-figure {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .nova-body {
      width: 150px;
      height: 150px;
      border-radius: 42% 42% 48% 48%;
      background: linear-gradient(135deg, #8d9dff, #5bded1);
      position: relative;
      box-shadow: inset 0 -10px 25px rgba(0,0,0,.06), 0 15px 30px rgba(91,124,255,.2);
    }

    .nova-body::before,
    .nova-body::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      top: 38px;
    }

    .nova-body::before { left: 34px; }
    .nova-body::after { right: 34px; }

    .nova-eye {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #1a2a4d;
      top: 44px;
    }

    .nova-eye.left { left: 40px; }
    .nova-eye.right { right: 40px; }

    .nova-smile {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 26px;
      width: 48px;
      height: 26px;
      border-bottom: 4px solid #1a2a4d;
      border-radius: 0 0 30px 30px;
    }

    .nova-spark {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255,184,0,.72);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(255,184,0,.12);
      animation: pulse 2s ease-in-out infinite;
    }

    .nova-spark.one { left: 18%; top: 24%; }
    .nova-spark.two { right: 18%; top: 20%; }
    .nova-spark.three { bottom: 20%; left: 24%; }

    .landing-copy {
      flex: 1.3;
      min-width: 260px;
    }

    .landing-copy h1 {
      margin: 0 0 12px;
      font-size: clamp(2.3rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .landing-copy p {
      margin: 0;
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 620px;
    }

    .landing-actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .landing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    .land-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 140px;
    }

    .land-card strong {
      font-size: 1.05rem;
    }

    .land-card span {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .sections-grid {
      display: grid;
      gap: 16px;
      margin-top: 28px;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
    }

    .preview-card {
      max-width: 260px;
      padding: 18px;
      background: linear-gradient(135deg, rgba(91,124,255,.12), rgba(27,183,168,.08));
      border-radius: 22px;
      border: 1px solid rgba(91,124,255,.18);
      box-shadow: var(--shadow);
      margin: 10px auto 0;
    }

    .preview-card .mini-surface {
      border-radius: 16px;
      background: rgba(255,255,255,.28);
      border: 1px solid rgba(255,255,255,.16);
      padding: 12px;
      margin-top: 10px;
    }

    .onboarding-screen {
      max-width: 860px;
      margin: 0 auto;
      padding: 26px 18px 34px;
    }

    .onboarding-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(91,124,255,.09);
      color: var(--primary);
      font-weight: 900;
      border: 1px solid rgba(91,124,255,.14);
    }

    .step-card {
      padding: 24px;
    }

    .step-card h2 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 2.6vw, 2.7rem);
      letter-spacing: -0.06em;
    }

    .step-card p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .option-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      min-height: 118px;
      text-align: center;
      font-weight: 800;
      color: var(--text);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .option-card:hover { border-color: rgba(91,124,255,.2); transform: translateY(-1px); }
    .option-card.selected {
      border-color: rgba(91,124,255,.45);
      background: linear-gradient(135deg, rgba(91,124,255,.07), rgba(27,183,168,.06));
      box-shadow: inset 0 0 0 1px rgba(91,124,255,.14);
    }

    .option-card .emoji { font-size: 2rem; }

    .choice-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .choice-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text);
      font-weight: 700;
    }

    .choice-item.selected {
      border-color: rgba(91,124,255,.44);
      background: rgba(91,124,255,.08);
    }

    .summary-box {
      display: grid;
      gap: 16px;
      background: rgba(91,124,255,.04);
      border: 1px solid rgba(91,124,255,.14);
      border-radius: 22px;
      padding: 18px;
      margin-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
    }

    .summary-row strong {
      color: var(--text);
    }

    .starter-shell {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 30px 18px;
      color: var(--muted);
      background: rgba(148,163,184,.03);
      border: 1px dashed var(--border);
      border-radius: 20px;
      margin-top: 18px;
    }

    .vocab-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .word-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .word-box strong { font-size: 1.02rem; }
    .word-box span { color: var(--muted); }

    .mastery-bubble {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 30px;
      border-radius: 999px;
      background: rgba(50,181,125,.12);
      color: var(--success);
      font-weight: 900;
    }

    .avatar-swatch {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: rgba(91,124,255,.08);
      border: 1px solid var(--border);
    }

    .profile-card {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-list {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .mini-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
      justify-content: center;
    }

    .mini-card .label {
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 0.06em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .mini-card .value {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .achievement-card {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: space-between;
    }

    .achievement-card.locked {
      opacity: 0.72;
      filter: grayscale(.12);
    }

    .achievement-card .left {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .achievement-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: rgba(255,184,0,.12);
      border: 1px solid rgba(255,184,0,.18);
    }

    .destination-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .destination-card .flag {
      font-size: 2rem;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      background: rgba(91,124,255,.08);
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .destination-card.locked {
      opacity: 0.6;
      filter: grayscale(.25);
    }

    .badge-pill {
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,184,0,.12);
      color: var(--warning);
      border: 1px solid rgba(255,184,0,.18);
    }

    .subtle-list {
      display: grid;
      gap: 10px;
    }

    .subtle-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(148,163,184,.03);
      color: var(--muted);
      font-weight: 700;
    }

    .subtle-item strong { color: var(--text); }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      background: rgba(17,29,48,.95);
      color: white;
      border-top: 1px solid rgba(255,255,255,.08);
      z-index: 108;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .bottom-nav button {
      background: transparent;
      border: none;
      color: rgba(255,255,255,.72);
      text-align: center;
      padding: 6px 4px 4px;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-weight: 700;
    }

    .bottom-nav button.active {
      color: white;
    }

    .bottom-nav .nav-bubble {
      width: 26px;
      height: 26px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.07);
    }

    .mobile-value-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .mobile-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 8px 12px;
      text-align: center;
      font-weight: 800;
    }

    .mobile-stat .emoji { display: block; font-size: 1.2rem; }

    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .stats-panel { display: none; }
      .content-grid { grid-template-columns: 1fr; }
      .main-shell { padding: 12px 12px 80px; }
      .bottom-nav { display: block; }
      .topbar { margin-bottom: 14px; }
    }

    @media (max-width: 680px) {
      .landing-hero,
      .hero-row,
      .onboarding-top,
      .starter-shell,
      .lesson-top,
      .lesson-progress-row,
      .topbar,
      .section-header {
        flex-direction: column;
        align-items: stretch;
      }

      .landing-screen,
      .onboarding-screen,
      .step-card {
        padding-left: 14px;
        padding-right: 14px;
      }

      .language-grid { grid-template-columns: 1fr; }
      .match-grid { grid-template-columns: 1fr; }
      .option-grid { grid-template-columns: 1fr; }
      .lesson-sheet { padding: 12px 12px 18px; }
      .primary-btn, .secondary-btn, .ghost-btn { width: 100%; }
      .hero-actions, .landing-actions, .modal-actions, .lesson-controls { width: 100%; }
      .hero-actions > *, .landing-actions > *, .modal-actions > *, .lesson-controls > * { flex: 1; }
      .topbar-actions { width: 100%; }
      .mobile-value-grid { display: grid; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .correct-answer-bounce {
      animation: correctBounce 420ms ease;
    }

    .incorrect-answer-shake {
      animation: wrongShake 420ms ease;
    }

    @keyframes correctBounce {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.04); }
      60% { transform: scale(0.98); }
    }

    @keyframes wrongShake {

    /* =====================================================
       STORAGE MANAGER
    ===================================================== */

    const StorageManager = {
      normalizeState(raw) {
        const base = defaultState();
        if (!raw || typeof raw !== 'object') return base;
        const merged = { ...base, ...raw };
        merged.settings = { ...base.settings, ...(raw.settings || {}) };
        merged.session = { ...base.session, ...(raw.session || {}) };
        merged.courseProgress = raw.courseProgress || {};
        merged.vocabulary = raw.vocabulary || {};
        merged.completedLessons = raw.completedLessons || {};
        merged.lessonScores = raw.lessonScores || {};
        merged.dailyQuests = raw.dailyQuests || [];
        merged.achievements = raw.achievements || [];
        merged.weakWords = raw.weakWords || {};
        merged.learnedWords = raw.learnedWords || {};
        merged.dailyHistory = raw.dailyHistory || {};
        merged.worldProgress = raw.worldProgress || {};
        merged.quests = raw.quests || [];
        merged.selectedGoal = raw.selectedGoal || merged.settings.goal || 'regular';
        if (typeof merged.xp !== 'number' || Number.isNaN(merged.xp)) merged.xp = 0;
        if (typeof merged.coins !== 'number' || Number.isNaN(merged.coins)) merged.coins = 0;
        if (typeof merged.hearts !== 'number' || Number.isNaN(merged.hearts)) merged.hearts = merged.maxHearts || 5;
        if (!merged.currentCourse) merged.currentCourse = merged.learningLanguage || 'spanish';
        if (typeof merged.motivation !== 'string') merged.motivation = '';
        return merged;
      },
      load() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return defaultState();
          }
          const parsed = JSON.parse(raw);
          return this.normalizeState(parsed);
        } catch (error) {
          console.warn('StorageManager: failed to parse saved state.', error);
          return defaultState();
        }
      },
      save() {
        try {
          const payload = JSON.stringify(state);
          window.localStorage.setItem(STORAGE_KEY, payload);
          return true;
        } catch (error) {
          console.warn('StorageManager: save failed.', error);
          return false;
        }
      },
      exportProgress() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lingoquest_progress.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        UIManager.showToast('Progress exported as JSON.');
      },
      async importProgress(file) {
        if (!file) return;
        const text = await file.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (error) {
          UIManager.showToast('That file is not valid LingoQuest JSON.');
          return;
        }
        const validated = this.normalizeState(parsed);
        Object.assign(state, validated);
        AppState.reconcileProgress();
        AppState.save();
        UIManager.render();
        UIManager.showToast('Progress imported successfully.');
      }
    };

      getFilteredCatalog({ query = '', region = 'all', status = 'all' } = {}) {
        const q = String(query || '').trim().toLowerCase();
        return LANGUAGE_CATALOG.filter(lang => {
          const matchesText = !q || [lang.name, lang.nativeName, lang.region, lang.languageCode].join(' ').toLowerCase().includes(q);
          const matchesRegion = region === 'all' || region === 'Popular' ? (region === 'all' || lang.region === region || lang.region === 'Popular') : lang.region === region;
          const matchesStatus = status === 'all' || lang.status === status;
          return matchesText && matchesRegion && matchesStatus && (!q || matchesText);
        });
      },
      getAvailableCourses() {
        return LANGUAGE_CATALOG.filter(lang => lang.status === 'available');

      getCourseInfo(code) {
        return COURSE_DATA[code] || null;

    /* =====================================================
       COURSE MANAGER
    ===================================================== */

    const CourseManager = {
      getCourse(code) {
        return COURSE_DATA[code] || null;
      },
      getCourseList() {
        return Object.values(COURSE_DATA);
      },
      getUnitInfo(courseId, unitIndex) {
        const course = this.getCourse(courseId);
        if (!course || !course.units[unitIndex]) return null;
        return course.units[unitIndex];
      },
      getLessonInfo(courseId, unitIndex, lessonIndex) {
        const course = this.getCourse(courseId);
        if (!course) return null;
        const unit = course.units[unitIndex];
        if (!unit || !unit.lessons[lessonIndex]) return null;
        return unit.lessons[lessonIndex];
      },
      ensureProgress(courseId) {
        if (!state.courseProgress[courseId]) {
          state.courseProgress[courseId] = {
            currentUnit: 1,
            currentLesson: 1,
            completedLessons: [],
            xp: 0,
            lessonsCompleted: 0,
            totalXP: 0,
            unitUnlocked: 1,
            lastVisited: null,
            totalCorrect: 0,
            totalWrong: 0
          };
        }
      },
      getCourseProgress(courseId) {
        this.ensureProgress(courseId);
        return state.courseProgress[courseId];
      },
      getCourseCompletionPercent(courseId) {
        const course = this.getCourse(courseId);
        const progress = this.getCourseProgress(courseId);
        if (!course) return 0;
        const totalLessonCount = course.units.reduce((sum, unit) => sum + unit.lessons.length, 0);
        return Math.min(100, Math.round((progress.completedLessons.length / totalLessonCount) * 100));
      },
      getLessonStatus(courseId, unitIndex, lessonIndex) {
        const course = this.getCourse(courseId);
        const progress = this.getCourseProgress(courseId);
        const id = `${unitIndex}:${lessonIndex}`;
        if (progress.completedLessons.includes(id)) return 'completed';
        if (!course || !course.units[unitIndex] || !course.units[unitIndex].lessons[lessonIndex]) return 'locked';
        const previousCompleted = (() => {
          if (unitIndex === 0 && lessonIndex === 0) return true;
          if (lessonIndex > 0) return progress.completedLessons.includes(`${unitIndex}:${lessonIndex - 1}`);
          const previousUnit = course.units[unitIndex - 1];
          if (!previousUnit) return false;
          return progress.completedLessons.includes(`${unitIndex - 1}:${previousUnit.lessons.length - 1}`);
        })();
        if (!previousCompleted) return 'locked';
        const isCurrent = progress.currentUnit === unitIndex + 1 && progress.currentLesson === lessonIndex + 1;
        return isCurrent ? 'current' : 'available';
      },
      getCurrentLessonNodeList(courseId) {
        const course = this.getCourse(courseId);
        const progress = this.getCourseProgress(courseId);
        if (!course) return [];
        const list = [];
        let index = 0;
        course.units.forEach((unit, unitIndex) => {
          unit.lessons.forEach((lesson, lessonIndex) => {
            list.push({
              id: `${unitIndex}:${lessonIndex}`,
              title: lesson.title,
              unitTitle: unit.title,
              status: this.getLessonStatus(courseId, unitIndex, lessonIndex),
              unitIndex,
              lessonIndex,
              sortIndex: index
            });
            index += 1;
          });
        });
        return list;
      }
    };

    /* =====================================================
       XP MANAGER
    ===================================================== */

    const XPManager = {
      getLevelInfo() {
        let current = LEVEL_TIERS[0];
        let next = LEVEL_TIERS[1] || current;
        for (let i = 0; i < LEVEL_TIERS.length; i++) {
          if (state.xp >= LEVEL_TIERS[i].xp) {
            current = LEVEL_TIERS[i];
          }
        }
        const nextLevelIndex = LEVEL_TIERS.findIndex(item => item.level === current.level + 1);
        if (nextLevelIndex > -1) {
          next = LEVEL_TIERS[nextLevelIndex];
        } else {
          next = current;
        }
        const start = current.xp;
        const end = next.xp;
        const progress = end === start ? 100 : ((state.xp - start) / (end - start)) * 100;
        return { current, next, progress: Math.max(0, Math.min(100, progress)), start, end };
      },
      addXP(amount, reason = 'lesson', toastText = null) {
        const prev = state.xp;
        state.xp += amount;
        if (state.xp > prev) {
          const levelInfo = this.getLevelInfo();
          state.level = levelInfo.current.level;
          UIManager.animateFloatingXP(`+${amount} XP`);
          if (toastText) UIManager.showToast(toastText || `+${amount} XP earned!`);
        }
        AppState.reconcileProgress();
      },
      getDailyGoalProgress() {
        const todayKey = AppState.getTodayKey();
        const seed = state.dailyHistory[todayKey] || { xp: 0 };
        return Number(seed.xp || 0);
      }
    };

    /* =====================================================
       STREAK MANAGER
    ===================================================== */

    const StreakManager = {
      getTodayKey() {
        return getLocalDateKey();
      },
      lastDay(dateStr) {
        return parseLocalDateKey(dateStr);
      },
      updateFromStudy() {
        const today = this.getTodayKey();
        const last = state.lastStudyDate || '';
        if (last === today) {
          state.streak = Math.max(Number(state.streak) || 0, 1);
          state.longestStreak = Math.max(Number(state.longestStreak) || 0, state.streak);
          return false;
        }
        if (!last) {
          state.streak = 1;
        } else {
          const difference = localDateDiffDays(last, today);
          if (difference === 1) {
            state.streak = (Number(state.streak) || 0) + 1;
          } else {
            state.streak = 1;
          }
        }
        state.longestStreak = Math.max(Number(state.longestStreak) || 0, state.streak);
        state.lastStudyDate = today;
        return true;
      },
      getWeeklyDays() {
        const days = [];
        const today = new Date();
        const date = new Date(today);
        const dayOfWeek = date.getDay();
        const start = new Date(date);
        start.setDate(date.getDate() - dayOfWeek);
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const key = getLocalDateKey(d);
          days.push({ key, label: ['M', 'T', 'W', 'T', 'F', 'S', 'S'][i], active: state.dailyHistory[key] && state.dailyHistory[key].xp > 0, strong: key === this.getTodayKey() });
        }
        return days;
      }
    };

        state.hearts = state.maxHearts;

    const QuestManager = {

        if (existing.length && existing[0].date === todayKey) {

          if (q.type === 'correct') q.progress = Math.min(q.target, history.correct || 0);

      getWordRecord(word, lang, translation) {
        const key = `${lang}:${word}`;
        if (!state.vocabulary[key]) {
          state.vocabulary[key] = {
            word,
            translation,
            language: lang,
            timesSeen: 0,
            timesCorrect: 0,
            timesWrong: 0,
            mastery: 0,
            lastReviewed: '',
            example: ''
          };
        }
        return state.vocabulary[key];
      },
      registerSeen(word, lang, translation, correct) {
        const record = this.getWordRecord(word, lang, translation);
        record.timesSeen += 1;
        if (correct) {
          record.timesCorrect += 1;
          record.mastery = Math.min(100, record.mastery + 12);
        } else {
          record.timesWrong += 1;
          record.mastery = Math.max(0, record.mastery - 8);
        }
        record.lastReviewed = getLocalDateKey();
        state.learnedWords[word] = true;
        if (record.mastery >= 70) state.weakWords[word] = false;
      },
      getReviewQueue() {
        return Object.values(state.vocabulary)
          .filter(word => word && word.word)
          .sort((a, b) => {
            if ((a.mastery || 0) !== (b.mastery || 0)) return (a.mastery || 0) - (b.mastery || 0);
            return (a.timesWrong || 0) - (b.timesWrong || 0);
          })
          .slice(0, 12);
      }
    };

    /* =====================================================

    ===================================================== */

    const AudioManager = {
      context: null,
      init() {
        try {
          if (!this.context) this.context = new (window.AudioContext || window.webkitAudioContext)();
        } catch (error) {
          console.warn('AudioManager: Web Audio not available.', error);
        }
      },
      beep(type = 'correct') {
        if (!state.settings.soundEnabled && !state.soundEnabled) return;
        try {
          this.init();
          if (!this.context) return;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();
          oscillator.connect(gain);
          gain.connect(this.context.destination);
          const now = this.context.currentTime;
          oscillator.type = type === 'correct' ? 'triangle' : type === 'incorrect' ? 'sawtooth' : 'square';
          oscillator.frequency.setValueAtTime(type === 'correct' ? 660 : type === 'incorrect' ? 220 : 500, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          oscillator.start(now);
          oscillator.stop(now + 0.22);
        } catch (error) {
          console.warn('AudioManager: beep failed.', error);
        }
      },
      speak(text, lang = 'es-ES', rate = 1) {
        if (!('speechSynthesis' in window) || !state.settings.speechEnabled) return false;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = rate;
        utterance.pitch = 1;
        utterance.volume = 0.9;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
        return true;
      },
      speechRecognitionSupported() {
        return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
      }
    };

    const LessonEngine = {
      buildQuestionSet(courseId, unitIndex, lessonIndex) {
        const course = COURSE_DATA[courseId];

        const lesson = unit.lessons[lessonIndex];
        const vocabulary = lesson.vocab || [];
        const outcome = [];

        const q = (config) => outcome.push(config);

        const correctAnswerOptions = (baseOptions, correct) => {
          const list = [...baseOptions];
          const chosen = new Set([correct]);
          while (list.length < 4 && chosen.size < baseOptions.length + 10) {
            const candidate = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            if (candidate && !chosen.has(candidate)) {
              list.push(candidate);
              chosen.add(candidate);
            }
          }
          return list.sort(() => Math.random() - 0.5);
        };

        q({
          type: 'multiple-choice',
          prompt: `What does “${vocabulary[0]}” mean?`,
          questionText: `What does “${vocabulary[0]}” mean?`,

            'Thanks'

          answer: lesson.title.includes('Greetings') || lesson.title.includes('Salutations') || lesson.title.includes('인사') || lesson.title.includes('नमस्कार') ? 'Hello' : 'Good',

        });

        q({
          type: 'translate-input',
          prompt: 'Translate: “thank you”',
          instruction: 'Type your answer in the target language.',
          answer: lesson.title.includes('Greetings') || lesson.title.includes('Salutations') || lesson.title.includes('인사') || lesson.title.includes('नमस्कार') ? 'gracias' : 'merci',

          requiredLocale: 'target',
          explanation: 'A polite thank-you is a key everyday phrase.'
        });

        q({
          type: 'word-bank',
          prompt: 'Build: “I like coffee.”',
          answer: ['me', 'gusta', 'el', 'café'],
          targetLanguage: 'spanish',
          bank: ['me', 'gusta', 'el', 'café', 'hola', 'agua'],
          explanation: 'You can arrange words into a natural sentence.'
        });

        q({
          type: 'matching',
          prompt: 'Match the words to their meanings.',
          left: ['casa', 'libro', 'agua', 'familia'],
          right: ['house', 'book', 'water', 'family'],
          answer: [
            { left: 'casa', right: 'house' },
            { left: 'libro', right: 'book' },
            { left: 'agua', right: 'water' },
            { left: 'familia', right: 'family' }
          ],
          explanation: 'Matching helps build vocabulary memory.'
        });

        q({
          type: 'fill-blank',
          prompt: 'Fill in the blank: “____ está la estación?”',
          answer: 'dónde',
          alternatives: ['donde', 'dónde'],
          explanation: '“Dónde” is the question word for asking where.'
        });

        q({
          type: 'listening',
          prompt: 'Listen and choose the correct meaning.',
          audioText: '¿Cómo te llamas?',
          choices: ['What is your name?', 'Where are you going?', 'How are you?', 'Thank you'],
          answer: 'What is your name?',
          explanation: 'This phrase asks someone their name.'
        });

        q({
          type: 'conversation-choice',
          prompt: 'A traveler says: “I need help.” What is the best response?',
          choices: ['Of course. I can help you.', 'Goodbye.', 'I am tired.', 'See you later.'],
          answer: 'Of course. I can help you.',
          explanation: 'Helpful responses are kind and useful.'
        });

        q({
          type: 'multiple-choice',
          prompt: 'What is the correct response to “Gracias”?',
          questionText: 'What is the correct response to “Gracias”?',
          choices: ['De nada', 'Adiós', 'Por favor', 'Gracias'],
          answer: 'De nada',
          explanation: '“De nada” is the standard polite reply to “thank you.”'
        });

        q({
          type: 'translate-input',
          prompt: 'Translate: “How are you?”',
          instruction: 'Type your answer.',
          answer: '¿cómo estás?',
          alternatives: ['como estas', '¿cómo estás?', '¿Como estas?'],
          explanation: 'This is a common phrase to check in with someone.'
        });

        q({
          type: 'match-image',
          prompt: 'Choose the correct image for “bread”.',
          imageType: 'bread',
          choices: [
            { label: 'Bread', emoji: '🍞', value: 'bread' },
            { label: 'Book', emoji: '📘', value: 'book' },
            { label: 'Train', emoji: '🚆', value: 'train' },
            { label: 'Apple', emoji: '🍎', value: 'apple' }
          ],
          answer: 'bread',
          explanation: 'A loaf of bread is a common food word.'
        });

        if (outcome.length < 8) {
          q({
            type: 'multiple-choice',
            prompt: 'Choose the best translation for “bus”.',
            questionText: 'Choose the best translation for “bus”.',
            choices: ['bus', 'train', 'book', 'water'],
            answer: 'bus',
            explanation: 'It is a transportation word used in cities.'
          });
        }

        return outcome.slice(0, 10);
      },
      prepareSession(courseId, unitIndex, lessonIndex) {
        const course = CourseManager.getCourse(courseId);
        const lesson = CourseManager.getLessonInfo(courseId, unitIndex, lessonIndex);
        if (!course || !lesson) return null;

      updateDailyHistory() {

        if (!state.dailyHistory[key]) state.dailyHistory[key] = { xp: 0, lessons: 0, correct: 0 };
      },
      updateGoalProgress(deltaXp, deltaLessons, deltaCorrect) {
        const today = this.getTodayKey();
        if (!state.dailyHistory[today]) state.dailyHistory[today] = { xp: 0, lessons: 0, correct: 0 };
        state.dailyHistory[today].xp = (state.dailyHistory[today].xp || 0) + deltaXp;
        state.dailyHistory[today].lessons = (state.dailyHistory[today].lessons || 0) + deltaLessons;
        state.dailyHistory[today].correct = (state.dailyHistory[today].correct || 0) + deltaCorrect;
        QuestManager.syncDailyProgress();
      },
      markLessonCompleted(courseId, unitIndex, lessonIndex, result) {
        const course = CourseManager.getCourse(courseId);
        const progress = CourseManager.getCourseProgress(courseId);
        if (!course || !course.units[unitIndex]) return;
        const unit = course.units[unitIndex];
        const id = `${unitIndex}:${lessonIndex}`;
        if (!progress.completedLessons.includes(id)) {
          progress.completedLessons.push(id);
        }
        progress.lessonsCompleted = progress.completedLessons.length;
        progress.lastVisited = new Date().toISOString();
        const isLastInUnit = lessonIndex >= unit.lessons.length - 1;
        if (isLastInUnit) {
          if (unitIndex < course.units.length - 1) {
            progress.currentUnit = unitIndex + 2;
            progress.currentLesson = 1;
            progress.unitUnlocked = Math.max(progress.unitUnlocked || 1, unitIndex + 2);
          } else {
            progress.currentUnit = course.units.length;
            progress.currentLesson = unit.lessons.length;
          }
        } else {
          progress.currentUnit = unitIndex + 1;
          progress.currentLesson = lessonIndex + 2;
        }
        const resultKey = `${courseId}:${id}`;
        state.completedLessons[resultKey] = result || { date: new Date().toISOString() };
        state.totalLessonsCompleted = Object.keys(state.completedLessons).length;
        state.currentCourse = courseId;
        state.currentUnit = progress.currentUnit;
        state.currentLesson = progress.currentLesson;
        AppState.reconcileProgress();
      },
      unlockNextLesson() {
        const course = CourseManager.getCourse(state.learningLanguage || state.currentCourse);
        if (!course) return;
        const progress = CourseManager.getCourseProgress(state.learningLanguage || state.currentCourse);
        const lessonCount = course.units.reduce((sum, unit) => sum + unit.lessons.length, 0);
        if (progress.completedLessons.length >= lessonCount) {
          return;
        }
        if (progress.currentLesson > 5) {
          progress.currentLesson = 1;
          progress.currentUnit += 1;
        }
        if (progress.currentUnit > course.units.length) {
          progress.currentUnit = course.units.length;
        }
      },

        return state.learningLanguage || state.currentCourse || 'spanish';

        return `

      renderOnboardingContent(step, native, target, goal) {
        if (step === 1) {
          return `
            <div class="option-grid">
              ${LanguageManager.getNativeLanguages().map(lang => `
                <button class="option-card ${native === lang.id ? 'selected' : ''}" data-action="select-native" data-language="${lang.id}">

                  <div>${lang.name}</div>
                  <small>${lang.nativeName}</small>
                </button>
              `).join('')}
            </div>
          `;
        }
        if (step === 2) {
          const list = LanguageManager.getFilteredCatalog({ region: 'all', status: 'all' }).slice(0, 12);
          return `
            <input class="search-box" data-role="language-search" placeholder="Search languages..." aria-label="Search languages" />
            <div class="option-grid">
              ${list.map(lang => `
                <button class="option-card ${target === lang.id ? 'selected' : ''}" data-action="select-target-language" data-language="${lang.id}">

                  <div>${lang.name}</div>
                  <small>${lang.nativeName}</small>

              `).join('')}
            </div>
          `;
        }
        if (step === 3) {
          const reasons = ['Travel', 'School', 'Career', 'Friends & Family', 'Culture', 'Just for Fun'];
          return `
            <div class="option-grid">
              ${reasons.map(reason => `
                <button class="option-card ${state.motivation === reason ? 'selected' : ''}" data-action="select-goal-purpose" data-goal="${reason}">

                  <div>${reason}</div>
                </button>
              `).join('')}
            </div>
          `;
        }
        if (step === 4) {
          const goals = Object.entries(GOAL_OPTIONS);
          return `
            <div class="option-grid">
              ${goals.map(([key, item]) => `
                <button class="option-card ${goal === key ? 'selected' : ''}" data-action="select-practice-goal" data-goal="${key}">
